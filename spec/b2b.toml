# Nguồn sự thật duy nhất cho connector J_B2B giữa board PWR và board CMP.
# Sinh: spec/generated/b2b.md, spec/generated/pinout_pwr_cmp.csv
schema = "flytex.b2b/1"

[connector]
name = "J_B2B"
type = "Box header 2x13, 2.54 mm, có khóa và chống cắm ngược"
mating = "Cùng loại trên CMP, chiều dài cáp tối đa 60 mm cho prototype"
pins_total = 26
logic_level_v = 3.3

# Giới hạn thiết kế để kiểm tra tự động. Đơn vị A.
[limits]
max_current_per_pin_a = 1.0
min_current_margin = 1.25

# Dòng thiết kế thực tế của từng net (không phải dòng tối đa của nguồn).
# Số ở đây là cận trên có căn cứ; xem docs/13 §4.3 về đỉnh dòng của modem.
[requirements]
"+5V_SOC" = { require_a = 1.5, note = "SoC + camera + thẻ SD, đỉnh ngắn hạn" }
"+5V_MODEM" = { require_a = 1.8, note = "Đỉnh burst modem Cat-1 quy về 5 V, chờ datasheet xác nhận" }
"+3V3" = { require_a = 0.6, note = "MCU, cảm biến, tham chiếu logic" }
"GND" = { require_a = 3.0, note = "Tổng dòng quay về" }

[[pins]]
num = 1
name = "+5V_SOC"
net = "+5V_SOC"
dir = "PWR->CMP"
max_a = 1.0
desc = "Rail SoC, 3 chân, tổng 3 A"

[[pins]]
num = 2
name = "+5V_MODEM"
net = "+5V_MODEM"
dir = "PWR->CMP"
max_a = 1.0
desc = "Rail modem, 3 chân. Đỉnh của modem Cat-1 lớn hơn bản nháp 0.6 A"

[[pins]]
num = 3
name = "+5V_SOC"
net = "+5V_SOC"
dir = "PWR->CMP"
max_a = 1.0

[[pins]]
num = 4
name = "+5V_MODEM"
net = "+5V_MODEM"
dir = "PWR->CMP"
max_a = 1.0

[[pins]]
num = 5
